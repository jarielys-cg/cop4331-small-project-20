<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Personal Contact Manager Dashboard</title>

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <!-- Custom CSS -->
        <link rel="stylesheet"  href="../css/dashboard.css">
        <link rel="stylesheet"  href="../css/dashboardModal.css">
        
    </head>
    <body>

        <div class="main-container">
            <!-- Sidebar navigation -->
            <div class = "sidebar">
                <div class="logo-pcm">pcm</div>
                <div class="sidebar-item"><i class="bi bi-people"></i><span>All Contacts</span></div>
                <div class="sidebar-item"><i class="bi bi-heart"></i><span>Favorites</span></div>
                <div class="sidebar-item"><i class="bi bi-collection"></i><span>Groups</span></div>
                <div class="sidebar-item"><i class="bi bi-gear"></i><span>Settings</span></div>
                <div class="sidebar-item sidebar-logout" onclick="logout()" ><i class="bi bi-box-arrow-right"></i><span>Logout</span></div>
            </div>
            <!-- Main content area -->
            <div class = "main-content">
                <!-- Header -->
                <div class = "dashboard-header">
                    <div class ="header-title">
                        <h1>Dashboard</h1>
                        <p class="header-subtitle">Manage your contacts</p>
                    </div>
                    <button class="addBtn" id="addContactBtn" ><i class="bi bi-plus-circle"></i>Add New Contact</button>
                </div>
                <!-- Statistics cards -->
                <div class="stats-cards">
                    <div class="card">
                        <div class="card-icon"><i class="bi bi-people-fill"></i></div>
                        <h2>Total Contacts</h2>
                        <p id="totalContacts">0</p>
                    </div>
                    <div class="card">
                        <div class="card-icon"><i class="bi bi-heart-fill"></i></div>
                        <h2>Favorites</h2>
                        <p id="totalFavorites">0</p>
                    </div>
                    <div class="card">
                        <div class="card-icon"><i class="bi bi-collection-fill"></i></div>
                        <h2>Groups</h2>
                        <p id="totalGroups">0</p>
                    </div>
                </div>
                <!-- Search & filter -->
                <div class="search-filter">
                    <input type="text" placeholder="Search contacts by name or phone number" id="searchInput">
                    <select>
                        <option>All Groups</option>
                        <option>Favorites</option>
                        <option>Family</option>
                        <option>Friends</option>
                    </select>
                </div>
                <!-- Contact list-->
                 <div class="contact-section">
                    <div class="section-header">
                        <h2 class="section-title">All Contacts</h2>
                    </div>
                    <table class="contact-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Phone Number</th>
                                <th>Email</th>
                                <th>Group</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Contact rows will be dynamically added here -->

                        </tbody>
                    </table>
                 </div>
            </div>
        </div>
        <!-- Custom JS -->
        <script src="../js/dashboard.js"></script>  
        <!-- Bootstrap JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
